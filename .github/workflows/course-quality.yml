name: Course Quality Checks

on:
  push:
    branches:
      - main
      - dev
      - v1.1-dev-testable-labs
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install course tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repository and content checks
        run: |
          python scripts/check_repo_structure.py
          python scripts/check_content_readiness.py
          python scripts/check_lab_targets.py
          python scripts/check_workflow_validation_baseline.py
          python scripts/check_root_process_docs.py

      - name: Build MkDocs source and navigation
        run: |
          python scripts/sync_mkdocs_content.py
          python scripts/generate_mkdocs_nav.py

      - name: MkDocs strict build
        run: python -m mkdocs build --strict

      - name: Offline artifact-promotion gate tests
        run: python -m unittest discover -s labs/mlops-supply-chain-labs/artifact-promotion -p 'test_*.py'

      - name: BrokenPilot tests
        working-directory: labs/brokenpilot/prototype-app
        run: |
          pip install -r requirements.txt
          pytest
          python preflight_qwen.py --help
          node --check static/app.js

      - name: Toy classifier tests
        working-directory: labs/toy-ml-attacks/toy-classifier-app
        run: |
          pip install -r requirements-dev.txt
          pytest

  artifact-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify offline artifact fixtures on Windows
        run: python -m unittest discover -s labs/mlops-supply-chain-labs/artifact-promotion -p 'test_*.py'

  brokenpilot-docker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: labs/brokenpilot/prototype-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start local lab
        run: docker compose up --build -d --wait
      - name: Exercise Mock Hub through published loopback port
        run: python tests/docker_smoke.py vulnerable
      - name: Check container restrictions and dependency scope
        run: |
          test "$(docker inspect brokenpilot-prototype --format '{{.Config.User}}')" = 10001:10001
          test "$(docker inspect brokenpilot-prototype --format '{{.HostConfig.ReadonlyRootfs}}')" = true
          test "$(docker inspect brokenpilot-prototype --format '{{join .HostConfig.CapDrop ","}}')" = ALL
          test "$(docker inspect brokenpilot-prototype --format '{{join .HostConfig.SecurityOpt ","}}')" = no-new-privileges:true
          test "$(docker inspect brokenpilot-prototype --format '{{.State.Health.Status}}')" = healthy
          test "$(docker port brokenpilot-prototype 8010/tcp)" = 127.0.0.1:8010
          docker compose exec -T brokenpilot python -c "import importlib.util; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('httpx') is None"
      - name: Compare all-controls Docker profile
        run: |
          docker compose -f docker-compose.yml -f docker-compose.controls.yml up -d --wait --force-recreate
          python tests/docker_smoke.py all-controls
      - name: Stop local lab
        if: always()
        run: docker compose down
